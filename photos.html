<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- 1.80: PWA — ติดตั้งลงหน้าจอหลัก/คอมได้ (manifest + ไอคอน · sw.js ลงทะเบียนใน api.js) -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0b6fcc" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="BNK Hub" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<script>(function(){try{document.documentElement.classList.add('nav-noanim');}catch(e){}})();</script>
<title>คลังรูปภาพกิจกรรม</title>
<link rel="stylesheet" href="assets/fontawesome/css/fontawesome.min.css" />
<link rel="stylesheet" href="assets/fontawesome/css/solid.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css?v=1.98.2.021126" />
<script>(function(){try{var c=localStorage.getItem('bnkah_theme_css_login')||localStorage.getItem('bnkah_theme_css');if(c){var e=document.createElement('style');e.id='bnkahThemeVars';e.textContent=c;document.head.appendChild(e);}}catch(e){}})();</script>
</head>
<body class="pubc-body">
  <!-- 1.76: หน้าสาธารณะ "คลังรูปภาพกิจกรรม" (ไม่ต้องล็อกอิน · ธีมกระดาษขาวเสมอ) — เฉพาะอัลบั้มที่เปิด "แสดงในหน้าสาธารณะ"
       Worker: publicAlbumList (ไม่ส่งชื่อผู้เพิ่ม · 1.85: ต้องมีคำค้น) · ลิงก์มาจากปุ่ม "แชร์หน้าสาธารณะ" ในหน้าคลังรูปภาพ -->
  <div class="topbar pubc-topbar">
    <button class="brand js-home-btn" type="button" tabindex="-1" style="cursor:default;"><span class="js-brand-logo"><span class="logo-dot"></span></span> <span class="js-site-name">BNKAcademicHub</span></button>
    <div class="user-info"><span>คลังรูปภาพกิจกรรม</span></div>
  </div>
  <header class="pubc-hero">
    <div class="pubc-logo"><i class="fa-solid fa-images" aria-hidden="true"></i></div>
    <h1>คลังรูปภาพกิจกรรม</h1>
    <p id="phSub">ค้นหาอัลบั้มภาพกิจกรรมจากชื่อกิจกรรม</p>
  </header>
  <!-- 1.85: ค้นหาอย่างเดียว — ไม่แสดงรายการอัลบั้มจนกว่าจะค้นหา (Worker ส่งเฉพาะอัลบั้มที่ชื่อตรงกับคำค้น ≥ 2 ตัวอักษร ไม่เกิน 20 อัลบั้ม) -->
  <main class="pubc-main ph-main">
    <form class="pubc-search" id="phForm" role="search" autocomplete="off">
      <div class="pubc-sbox">
        <label class="pubc-in"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><input id="phSearch" type="search" maxlength="80" placeholder="พิมพ์ชื่อกิจกรรม อย่างน้อย 2 ตัวอักษร" aria-label="ค้นหาอัลบั้มจากชื่อกิจกรรม" /></label>
        <button type="submit" class="btn btn-primary" id="phGo">ค้นหา</button>
      </div>
    </form>
    <div id="phRoot" aria-live="polite"></div>
  </main>
  <div id="app-footer"></div>
  <script src="assets/api.js?v=1.98.2.021126"></script>
  <script src="assets/gallery.js?v=1.98.2.021126"></script>
  <script>
    mountFooter();
    applyBranding();
    var $ = function (id) { return document.getElementById(id); };
    var albums = [];
    var EXAMPLES = ['กีฬาสี', 'ไหว้ครู', 'ปัจฉิม'];
    function idle() {
      $('phRoot').innerHTML = '<div class="pubc-empty ph-idle"><i class="fa-solid fa-images" aria-hidden="true"></i><div>พิมพ์ชื่อกิจกรรมที่ต้องการ แล้วกดค้นหา</div><div class="ph-ex">' +
        EXAMPLES.map(function (t, i) { return '<button type="button" data-ex="' + escapeHtml(t) + '">' + (i === 0 ? 'เช่น ' : '') + escapeHtml(t) + '</button>'; }).join('') + '</div></div>';
    }
    async function search() {
      var q = $('phSearch').value.replace(/\s+/g, ' ').trim(), root = $('phRoot');
      try { history.replaceState(null, '', location.pathname + (q ? '?q=' + encodeURIComponent(q) : '')); } catch (e) { /* ไม่เป็นไร */ }
      if (!q) { idle(); return; }
      if (q.replace(/\s/g, '').length < 2) { root.innerHTML = '<div class="pubc-empty">กรุณาพิมพ์อย่างน้อย 2 ตัวอักษร</div>'; return; }
      root.innerHTML = '<div class="loading">กำลังค้นหา</div>';
      try {
        var r = await apiCall('publicAlbumList', { q: q });
        albums = r.items || [];
        if (r.schoolName) $('phSub').textContent = 'ภาพกิจกรรมของ' + r.schoolName + ' · ค้นหาอัลบั้มจากชื่อกิจกรรม';
        if (!albums.length) { root.innerHTML = '<div class="pubc-empty"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i> ไม่พบอัลบั้มที่ตรงกับ "' + escapeHtml(q) + '"<div class="hint">ลองพิมพ์คำอื่น หรือพิมพ์เพียงบางส่วนของชื่อกิจกรรม</div></div>'; return; }
        root.innerHTML = '<div class="pubc-count">' + (r.more ? 'พบมากกว่า ' + albums.length + ' อัลบั้ม — แสดง ' + albums.length + ' อัลบั้มล่าสุด พิมพ์ชื่อให้เจาะจงขึ้นเพื่อดูอัลบั้มอื่น' : 'พบ ' + albums.length + ' อัลบั้ม') + '</div>' +
          '<div class="alb-grid">' + albums.map(function (a) { return albumCardHtml(a, {}); }).join('') + '</div>';
        wireAlbumCovers(root);
        loadManagedCovers(root, albums, true);
      } catch (e) { root.innerHTML = '<div class="error-box">' + escapeHtml(e.message) + '</div>'; }
    }
    $('phForm').addEventListener('submit', function (e) { e.preventDefault(); search(); });
    $('phSearch').addEventListener('input', function () { if (!this.value.trim()) search(); });
    $('phRoot').addEventListener('click', function (e) {
      var ex = e.target.closest('[data-ex]'); if (ex) { $('phSearch').value = ex.getAttribute('data-ex'); search(); return; }
      var card = e.target.closest('[data-alb]'); if (!card || !e.target.closest('[data-alb-copy]')) return;
      var a = albums.filter(function (x) { return x.id === card.getAttribute('data-alb'); })[0];
      if (a) copyAlbumText(a);
    });
    getSiteSettings().then(function (st) { var n = (st && st.schoolName) || ''; if (n) $('phSub').textContent = 'ภาพกิจกรรมของ' + n + ' · ค้นหาอัลบั้มจากชื่อกิจกรรม'; }).catch(function () {});
    var q0 = new URLSearchParams(location.search).get('q') || '';
    if (q0) { $('phSearch').value = q0; search(); } else idle();
  </script>
</body>
</html>
