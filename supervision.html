<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0b6fcc" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="BNK Hub" />

<script>(function(){try{var t=localStorage.getItem('bnkah_theme');if(t==='dark'||t==='sepia')document.documentElement.setAttribute('data-theme',t);document.documentElement.classList.add('nav-noanim');if(localStorage.getItem('bnkah_memo_off')==='1')document.documentElement.classList.add('memo-off');}catch(e){}})();</script>
<title>นิเทศการสอน — BNKAcademicHub</title>
<link rel="stylesheet" href="assets/fontawesome/css/fontawesome.min.css" />
<link rel="stylesheet" href="assets/fontawesome/css/solid.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css?v=1.98.2.021126" />
<script>(function(){try{var c=localStorage.getItem('bnkah_theme_css');if(c){var e=document.createElement('style');e.id='bnkahThemeVars';e.textContent=c;document.head.appendChild(e);}}catch(e){}})();</script>
</head>
<body>
  <div id="app-topbar"></div>
  <!-- 1.98 · 1.98.1: นิเทศการสอน — ครูเลือกคาบ (วันในสัปดาห์ + คาบ) · ผู้จัดการงานนิเทศลงวันในปฏิทิน · ผู้นิเทศทำแบบประเมิน -->
  <div class="container">
    <div class="page-header">
      <div>
        <h1><i class="fa-solid fa-chalkboard-user ui-icon" style="color:var(--primary)" aria-hidden="true"></i> นิเทศการสอน</h1>
        <p id="spIntro">เลือกคาบรับการนิเทศ · ดูวันนิเทศ · ทำแบบประเมิน</p>
      </div>
      <div class="sp-roundpick" id="spRoundPick" hidden><label for="spRoundSel">รอบนิเทศ</label><select id="spRoundSel"></select></div>
    </div>
    <div class="sp-tabs" id="spTabs" role="tablist"></div>
    <div id="spBody"><div class="loading">กำลังโหลด...</div></div>
  </div>

  <!-- เลือกผู้นิเทศ / เปลี่ยนคาบแทนครู / ดูผลประเมิน (ใช้ป็อปอัปเดียว) -->
  <div class="modal-backdrop" id="spModal" hidden>
    <div class="modal-box modal-box-wide sp-modal-box">
      <button type="button" class="modal-close-x" data-sp-close aria-label="ปิด">✕</button>
      <h3 id="spModalTitle"></h3>
      <div id="spModalBody" style="text-align:left"></div>
      <div class="modal-actions" id="spModalActions"></div>
    </div>
  </div>
  <input type="file" id="spPlanFile" hidden />
  <div id="app-footer"></div>
  <script src="assets/api.js?v=1.98.2.021126"></script>
  <script>
    var session = requireLogin();
    if (session) { mountChrome('supervision'); if (typeof mountFooter === 'function') mountFooter(); }
    var DAYS = ['', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์'], DAYS_S = ['', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.'];
    var MS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
    var B = null;               // ผลจาก supBoot
    var st = { tab: '', roundId: '', D: null, busy: null, evals: null, sats: null, tt: null, picks: {}, sel: '', pickDate: '', schedView: 'day', dutySel: '', extend: 0, onlyWait: true, filterGroup: '', q: '', formKind: 'eval', all: null, allRound: '', allQ: '', allG: '' };
    var body = document.getElementById('spBody');
    // 1.98.2: กันกระพริบ — คงความสูงเดิมระหว่างวาดใหม่ (ไม่ให้หน้ากระตุก/เลื่อน) · โหลดนานเกิน 300 ms ค่อยขึ้น "กำลังโหลด"
    function setBody(html) { var h = body.offsetHeight; body.style.minHeight = h + 'px'; body.innerHTML = html; requestAnimationFrame(function () { body.style.minHeight = ''; }); }
    function lockH() { body.style.minHeight = body.offsetHeight + 'px'; return function () { requestAnimationFrame(function () { body.style.minHeight = ''; }); }; }
    function lazyLoading(msg) { var t = setTimeout(function () { setBody('<div class="loading">' + (msg || 'กำลังโหลด...') + '</div>'); }, 300); return function () { clearTimeout(t); }; }

    // ---------- ตัวช่วย ----------
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function ymdParts(s) { var p = String(s).split('-'); return { y: +p[0], m: +p[1], d: +p[2] }; }
    function dowOf(s) { var p = ymdParts(s); return new Date(Date.UTC(p.y, p.m - 1, p.d)).getUTCDay(); }
    function addD(s, n) { var p = ymdParts(s), d = new Date(Date.UTC(p.y, p.m - 1, p.d + n)); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
    function thD(s, withDay) { if (!s) return ''; var p = ymdParts(s); return (withDay ? DAYS_S[dowOf(s)] + ' ' : '') + p.d + ' ' + MS[p.m - 1] + ' ' + (p.y + 543); }
    function thDS(s) { var p = ymdParts(s); return p.d + ' ' + MS[p.m - 1]; }
    function semTxt(r) { return r.semester === 'summer' ? 'ภาคฤดูร้อน ' + r.academicYear : 'ภาคเรียนที่ ' + r.semester + '/' + r.academicYear; }
    function slotLabel(s) { return (s.code || s.subject || '') + (s.room ? ' ' + s.room : ''); }
    function roundOf(id) { return (B.rounds || []).filter(function (r) { return r.id === id; })[0] || null; }
    function nameOf(id) { var p = st.D && st.D.people.filter(function (x) { return x.id === id; })[0]; return p ? p.name : ''; }
    function err(msg) { return '<div class="error-box">' + escapeHtml(msg) + '</div>'; }
    function gradeOf(roomId) { return (/^m(\d)_/.exec(roomId || '') || [])[1] || ''; }
    function modal(title, html, actions) {
      var mb0 = document.getElementById('spModalBody'); mb0.onchange = null; mb0.onclick = null;
      document.getElementById('spModalTitle').innerHTML = title;
      document.getElementById('spModalBody').innerHTML = html;
      document.getElementById('spModalActions').innerHTML = (actions || '') + '<button type="button" class="btn btn-ghost btn-close" data-sp-close>ปิด</button>';
      showModalEl(document.getElementById('spModal'));
    }
    function closeModal() { hideModalEl(document.getElementById('spModal')); }
    document.getElementById('spModal').addEventListener('click', function (e) { if (e.target.closest('[data-sp-close]')) closeModal(); });

    // ---------- โหลด ----------
    async function boot(keepTab) {
      try { B = await apiCall('supBoot', {}); }
      catch (e) { body.innerHTML = err(e.message); return; }
      if (B.enabled === false) { document.getElementById('spTabs').innerHTML = ''; document.getElementById('spRoundPick').hidden = true; body.innerHTML = '<div class="card sp-empty"><i class="fa-solid fa-power-off"></i><p>ระบบนิเทศการสอนปิดใช้งานอยู่' + (B.superAdmin ? ' — เปิดได้ที่ ตั้งค่าระบบ → นิเทศการสอน' : '') + '</p></div>'; return; }
      if (!B.sqlReady) { document.getElementById('spTabs').innerHTML = ''; body.innerHTML = '<div class="card">' + err('ยังใช้หน้านี้ไม่ได้ — ผู้ดูแลระบบต้องรัน SQL ชุดที่สามสิบสาม และสามสิบสี่ก่อน (ดู README)') + '</div>'; return; }
      if ((B.manager || B.viewer) && (!st.roundId || !roundOf(st.roundId))) st.roundId = B.rounds[0] ? B.rounds[0].id : '';
      renderTabs(keepTab);
    }
    function tabList() {
      var t = [];
      if (B.mine.length) t.push(['mine', 'fa-user-check', 'คาบของฉัน']);
      if (B.duties.length) t.push(['duty', 'fa-clipboard-check', 'คาบที่ฉันต้องนิเทศ']);
      if ((B.allRounds || []).length) t.push(['all', 'fa-calendar-check', 'ตารางนิเทศรวม']); // 1.98.1: ครูทุกคนเห็น
      if (B.manager) t.push(['rounds', 'fa-layer-group', 'รอบนิเทศ'], ['sup', 'fa-users', 'ผู้นิเทศ'], ['form', 'fa-list-check', 'แบบประเมิน'], ['dates', 'fa-calendar-days', 'ลงวันนิเทศ']);
      if (B.manager || B.viewer) t.push(['sched', 'fa-table-list', B.viewer ? 'ตารางและผลนิเทศ' : 'ตารางนิเทศ']);
      return t;
    }
    function renderTabs(keepTab) {
      var t = tabList();
      if (!t.length) { document.getElementById('spTabs').innerHTML = ''; body.innerHTML = '<div class="card sp-empty"><i class="fa-solid fa-chalkboard-user"></i><p>ยังไม่มีรอบนิเทศ</p></div>'; return; }
      if (!keepTab || !t.some(function (x) { return x[0] === st.tab; })) {
        var h = (location.hash || '').replace('#', '');
        st.tab = t.some(function (x) { return x[0] === h; }) ? h : t[0][0];
      }
      document.getElementById('spTabs').innerHTML = t.map(function (x) { return '<button type="button" role="tab" data-sp-tab="' + x[0] + '" class="' + (x[0] === st.tab ? 'on' : '') + '"><i class="fa-solid ' + x[1] + '" aria-hidden="true"></i> ' + x[2] + '</button>'; }).join('');
      renderRoundPick();
      show();
    }
    function renderRoundPick() {
      var mgrTab = ['sup', 'form', 'dates', 'sched'].indexOf(st.tab) !== -1, box = document.getElementById('spRoundPick');
      box.hidden = !(mgrTab && B.rounds.length);
      if (!box.hidden) document.getElementById('spRoundSel').innerHTML = B.rounds.map(function (r) { return '<option value="' + escapeHtml(r.id) + '"' + (r.id === st.roundId ? ' selected' : '') + '>' + escapeHtml(r.title) + '</option>'; }).join('');
    }
    document.getElementById('spRoundSel').addEventListener('change', function () { st.roundId = this.value; st.D = null; st.busy = null; st.evals = null; st.sats = null; st.sel = ''; show(); });
    document.getElementById('spTabs').addEventListener('click', function (e) {
      var b = e.target.closest('[data-sp-tab]'); if (!b) return;
      st.tab = b.getAttribute('data-sp-tab'); try { history.replaceState(null, '', '#' + st.tab); } catch (x) { /* ข้าม */ }
      document.querySelectorAll('#spTabs [data-sp-tab]').forEach(function (x) { x.classList.toggle('on', x === b); });
      renderRoundPick(); show();
    });
    async function needDetail() {
      if (!st.roundId) return false;
      if (!st.D || st.D.round.id !== st.roundId) st.D = await apiCall('supRoundDetail', { roundId: st.roundId });
      return true;
    }
    async function show() {
      var fn = { mine: renderMine, duty: renderDuty, all: renderAll, rounds: renderRounds, sup: renderSup, form: renderForm, dates: renderDates, sched: renderSched }[st.tab];
      try {
        if (['sup', 'form', 'dates', 'sched'].indexOf(st.tab) !== -1) {
          if (!B.rounds.length) { body.innerHTML = '<div class="card sp-empty"><i class="fa-solid fa-layer-group"></i><p>ยังไม่มีรอบนิเทศ' + (B.manager ? ' — สร้างรอบที่แท็บ "รอบนิเทศ"' : '') + '</p></div>'; return; }
          var stop = (!st.D || st.D.round.id !== st.roundId) ? lazyLoading() : function () {};
          try { await needDetail(); } finally { stop(); }
        }
        var un = lockH(); try { await fn(); } finally { un(); }
      } catch (e) { body.innerHTML = err(e.message); }
    }

    // ---------- แบบประเมิน: หัวข้อใหญ่ (section) / ข้อย่อย + เลขข้อพิมพ์เอง (ใช้ทั้งแบบนิเทศและความพึงพอใจ) ----------
    function qNum(f) { return f.num || ''; } // 1.98.2: เลขไม่บังคับ — ไม่ใส่ = ว่าง
    function qText(f) { return ((f.num ? f.num + ' ' : '') + f.label); }
    function isHead(f) { return f.type === 'section' || !!f.head; }
    function subMap(form) { var seen = false, m = {}; (form || []).forEach(function (f) { if (isHead(f)) seen = true; else if (seen || /\./.test(f.num || '')) m[f.id] = 1; }); return m; }
    function formFillHtml(form, ans, can, id) {
      ans = ans || {}; var sm = subMap(form);
      var rate = function (f, v) { return '<div class="sp-rate" data-q="' + escapeHtml(f.id) + '">' + [1, 2, 3, 4, 5].map(function (n) { return '<button type="button" data-rate="' + n + '" title="' + n + ' = ' + SUP_LEVELS[n] + '" class="' + (String(v) === String(n) ? 'on' : '') + '"' + (can ? '' : ' disabled') + '>' + n + '</button>'; }).join('') + '</div>'; };
      var lab = function (f) { return (f.num ? '<b>' + escapeHtml(f.num) + '</b> ' : '') + escapeHtml(f.label) + (f.required ? ' <span class="cf-req">*</span>' : ''); };
      return '<div class="sp-evf" id="' + id + '">' + (form || []).map(function (f) {
        if (f.type === 'section') return '<div class="sp-sec">' + escapeHtml(qText(f)) + '</div>';
        var v = ans[f.id], cls = f.head ? ' head' : (sm[f.id] ? ' sub' : '');
        if (f.type === 'rating') return '<div class="sp-qi' + cls + '"><span>' + lab(f) + '</span>' + rate(f, v) + '</div>';
        return '<div class="sp-evq' + cls + '"><div class="q">' + lab(f) + '</div><textarea rows="3" maxlength="2000" data-qt="' + escapeHtml(f.id) + '"' + (can ? '' : ' disabled') + '>' + escapeHtml(v || '') + '</textarea></div>';
      }).join('') + '<div class="sp-scale">' + [5, 4, 3, 2, 1].map(function (n) { return n + ' = ' + SUP_LEVELS[n]; }).join(' · ') + '</div></div>';
    }
    function readFormAnswers(id) {
      var a = {}, box = document.getElementById(id); if (!box) return a;
      box.querySelectorAll('[data-q]').forEach(function (g) { var on = g.querySelector('button.on'); if (on) a[g.getAttribute('data-q')] = +on.getAttribute('data-rate'); });
      box.querySelectorAll('[data-qt]').forEach(function (x) { if (x.value.trim()) a[x.getAttribute('data-qt')] = x.value.trim(); });
      return a;
    }
    function checkForm(form, a) {
      for (var i = 0; i < (form || []).length; i++) { var f = form[i]; if (f.type !== 'section' && f.required && (a[f.id] == null || a[f.id] === '')) return (f.type === 'rating' ? 'กรุณาให้คะแนน ' : 'กรุณากรอก ') + qText(f); }
      return '';
    }

    // ---------- ตารางสอน (เลือกคาบ) ----------
    function ttHtml(slots, picks, locked) {
      var m = {}; (slots || []).forEach(function (x) { m[x.day + '-' + x.period] = x; });
      var h = '<div class="sp-tt-wrap"><table class="tt-grid sp-tt"><thead><tr><th class="tt-dh"></th>';
      for (var p = 1; p <= 8; p++) h += '<th>คาบ ' + p + '<small>' + (TT_TIMES[p] || '') + '</small></th>';
      h += '</tr></thead><tbody>';
      for (var d = 1; d <= 5; d++) {
        h += '<tr><td class="tt-day">' + DAYS_S[d] + '</td>';
        for (var p2 = 1; p2 <= 8; p2++) {
          var k = d + '-' + p2, x = m[k], on = picks[k];
          if (!x) { h += '<td></td>'; continue; }
          var g = gradeOf(x.roomId);
          h += '<td class="tt-c ' + (g ? 'g' + g : '') + (on ? (locked ? ' sp-lock' : ' sp-on') : '') + (locked ? '' : ' sp-can') + '"' + (locked ? '' : ' data-pick="' + k + '" role="button" tabindex="0"') + ' title="' + escapeHtml((x.subject || '') + ' ' + (x.room || '')) + '">' +
            '<div class="tt-in"><b>' + escapeHtml(x.code || x.subject) + '</b><span>' + escapeHtml(x.room || '') + '</span></div>' + (on ? '<span class="sp-badge">' + (locked ? escapeHtml(on === true ? 'คาบนิเทศ' : on) : 'เลือกแล้ว') + '</span>' : '') + '</td>';
        }
        h += '</tr>';
      }
      return h + '</tbody></table></div>';
    }
    async function loadMyTT() {
      if (st.tt) return st.tt;
      st.tt = await apiCall('supTimetable', {});
      return st.tt;
    }

    // ---------- แท็บ: คาบของฉัน (ครูผู้รับการนิเทศ) ----------
    function supBoxHtml(m) {
      return '<div class="sp-sups"><h4><i class="fa-solid fa-user-tie"></i> ผู้นิเทศ' + (m.supervisors.length ? ' (' + m.supervisors.length + ' คน)' : '') + '</h4>' +
        (m.supervisors.length ? m.supervisors.map(function (x) { return '<div class="sp-sprow"><span class="sp-av">' + escapeHtml(String(x.name).replace(/^(นาย|นางสาว|นาง|ผอ\.|รอง ผอ\.|ดร\.)\s*/, '').charAt(0)) + '</span>' + escapeHtml(x.name) + '</div>'; }).join('') : '<div class="mut">รอผู้จัดการงานนิเทศกำหนด</div>') + '</div>';
    }
    function planBoxHtml(m, r) {
      return '<div class="sp-plan">' + (m.plan ? '<a class="btn btn-secondary btn-sm" href="' + escapeHtml(m.plan.url) + '" target="_blank" rel="noopener"><i class="fa-solid fa-paperclip"></i> ' + escapeHtml(m.plan.name) + '</a> <button type="button" class="btn btn-ghost btn-sm" data-plan-del="' + escapeHtml(r.id) + '">ลบไฟล์</button>' :
        '<button type="button" class="btn btn-secondary btn-sm" data-plan-add="' + escapeHtml(r.id) + '"' + (m.slots.length ? '' : ' disabled title="เลือกคาบก่อน"') + '><i class="fa-solid fa-paperclip"></i> แนบแผนการสอน (ไม่บังคับ)</button>') + '</div>';
    }
    function pickBarHtml(m, r, tt, late) {
      var pk = st.picks[r.id] || {}, keys = Object.keys(pk), saved = m.slots.length > 0;
      var savedSame = saved && keys.length === m.slots.length && m.slots.every(function (s) { return pk[s.day + '-' + s.period]; });
      var desc = keys.map(function (k) { var x = (tt && tt.slots || []).filter(function (y) { return y.day + '-' + y.period === k; })[0], d = +k.split('-')[0], p = +k.split('-')[1]; return 'ทุกวัน' + DAYS[d] + ' คาบ ' + p + (x ? ' · ' + slotLabel(x) : ''); }).join(' / ');
      return '<div class="sp-bar"><span>คาบที่เลือก: <b class="ok">' + (keys.length ? escapeHtml(desc) : '—') + '</b> <small class="mut">(' + keys.length + '/' + r.perTeacher + ')</small>' + (savedSame ? ' <span class="sp-st ok">ส่งแล้ว · รอเจ้าหน้าที่ลงวันที่</span>' : '') + '</span>' +
        planBoxHtml(m, r) + (late ? '' : '<button type="button" class="btn btn-success" data-pick-save="' + escapeHtml(r.id) + '"' + (keys.length === r.perTeacher && !savedSame ? '' : ' disabled') + '><i class="fa-solid fa-check"></i> ' + (saved ? 'บันทึกคาบที่เปลี่ยน' : 'ส่งคาบที่เลือก') + '</button>') + '</div>';
    }
    function satHtml(m, r) {
      if (!m.canSat || !(r.satForm || []).some(function (f) { return f.type !== 'section'; })) return '';
      return '<div class="sp-satbox"><h3><i class="fa-solid fa-face-smile"></i> แบบประเมินความพึงพอใจต่อการนิเทศ <span class="mut">· ได้รับการนิเทศแล้ว' + (m.sat ? ' · ส่งแล้ว ' + escapeHtml(formatDateTimeThai(m.sat.savedAt)) + ' (แก้ได้)' : '') + '</span></h3>' +
        formFillHtml(r.satForm, m.sat && m.sat.answers, true, 'spSat_' + r.id) +
        '<div class="sp-evact"><span class="mut"><i class="fa-solid fa-lock"></i> ผู้นิเทศไม่เห็นคำตอบนี้ · ผู้มีสิทธิ์ดูผลเห็นสรุป</span><button type="button" class="btn btn-success" data-sat-save="' + escapeHtml(r.id) + '"><i class="fa-solid fa-paper-plane"></i> ' + (m.sat ? 'บันทึกการแก้ไข' : 'ส่งแบบประเมิน') + '</button></div></div>';
    }
    async function renderMine() {
      var stopL = st.tt ? function () {} : lazyLoading('กำลังโหลดตารางสอน...');
      var tt = null; try { tt = await loadMyTT(); } catch (e) { tt = { linked: false, reason: e.message, slots: [] }; } stopL();
      var html = B.mine.map(function (m) {
        var r = roundOf(m.roundId); if (!r) return '';
        var dated = m.slots.some(function (s) { return s.date; }), today = todayYmd();
        var late = r.pickUntil && today > r.pickUntil;
        var head = '<div class="sp-rhead"><div><h2>' + escapeHtml(r.title) + '</h2><div class="mut">' + escapeHtml(semTxt(r)) + ' · ช่วงนิเทศ ' + thD(r.startDate) + ' – ' + thD(r.endDate) + (r.pickUntil ? ' · เลือกคาบได้ถึง ' + thD(r.pickUntil) : '') + '</div></div></div>';
        if (dated) {
          var picks = {}; m.slots.forEach(function (s) { picks[s.day + '-' + s.period] = s.date ? 'นิเทศ ' + thDS(s.date) : 'รอลงวัน'; });
          return '<div class="card sp-round" data-round="' + escapeHtml(r.id) + '">' + head +

    var REP_CSS = '.rp-pg{width:794px;box-sizing:border-box;padding:40px 52px;background:#fff;color:#0f172a;font-family:Sarabun,sans-serif;font-size:15px;line-height:1.45}' +

    async function repEnsurePhotos(rows) {

    async function openReport() {
      await ensureEvals();

    async function exportReport(rows) {
      var o = repState.opts;
      await withProgress('กำลังสร้างรายงาน PDF', async function (p) {
        await loadScriptOnce('assets/html2canvas.min.js'); await loadScriptOnce('assets/jspdf.umd.min.js');

        var faces = [400, 700].map(function (w) { return '@font-face{font-family:Sarabun;font-weight:' + w + ';src:url(' + u + 'sarabun-thai-' + w + '-normal.woff2) format("woff2");unicode-range:U+0E00-0E7F}@font-face{font-family:Sarabun;font-weight:' + w + ';src:url(' + u + 'sarabun-latin-' + w + '-normal.woff2) format("woff2")}'; }).join('');

            if (first) { try { await html2canvas(d.body.firstChild, { scale: 0.3, backgroundColor: '#ffffff', logging: false, windowWidth: 810 }); } catch (we) { /* อุ่นเครื่อง */ } }
            var cv = await html2canvas(d.body.firstChild, { scale: 2, backgroundColor: '#ffffff', logging: false, windowWidth: 810 });
            // ยาวเกิน 1 หน้า = ตัดเป็นหลายหน้า A4
