<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- 1.80: PWA — ติดตั้งลงหน้าจอหลัก/คอมได้ (manifest + ไอคอน · sw.js ลงทะเบียนใน api.js) -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0b6fcc" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="BNK Hub" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<!-- หน้าแสดงผลงานสาธารณะ (view.html) บังคับให้เป็นโหมดสว่างเสมอ (ตั้งแต่ V9.9) — ไม่มีสคริปต์อ่านค่าธีมจาก localStorage เหมือนหน้าอื่น จึงไม่มีทาง set data-theme="dark" ได้เลย ไม่ว่าคนที่กดเข้ามาจะเคยเปิดโหมดมืดไว้ในเบราว์เซอร์เครื่องนั้นหรือไม่ก็ตาม -->
<title>ผลงาน — BNKAcademicHub</title>
<!-- Tailwind CDN ที่เคยฝังไว้ตรงนี้ถูกเอาออกแล้ว (ตั้งแต่ V11.8.3) — สาเหตุที่แท้จริงของปัญหาช่องกรอกข้อมูล "ชิดขอบซ้าย"
     ที่ผู้ใช้แจ้งซ้ำหลายรอบ ยืนยันด้วยเครื่องคอมที่เพิ่งซื้อใหม่ไม่เคยตั้งค่าอะไรก็ยังเป็น + คอนโซล DevTools แสดง
     getComputedStyle(...).paddingLeft = "0px" จริง ทั้งที่ style.css ที่เซิร์ฟเวอร์ส่งออกมาตรงกับซอร์สทุกตัวอักษร:
     สคริปต์ Tailwind CDN ตัวนี้เดิมใส่ไว้แค่ช่วงออกแบบเพื่ออ้างอิงโทนสีเท่านั้น (ไม่มี class ของ Tailwind ใช้งานจริงในเว็บเลย
     สักจุด — เช็คแล้วทั้ง 5 หน้า) แต่ตัว CDN สร้าง Preflight (CSS reset มาตรฐานของ Tailwind ที่ตั้ง padding/border ของ
     input ทุกตัวเป็น 0 เพื่อ "ล้างค่า default ของเบราว์เซอร์") แล้วแทรกสไตล์ของตัวเองเข้า <head> ทีหลัง (browser ประมวลผล
     script แบบ async หลังโหลดเน็ตเวิร์กเสร็จ) ทำให้ชนะลำดับ cascade ทับ padding: 10px 28px ที่ style.css ของเราตั้งไว้
     โดยไม่มีทางแก้จากฝั่ง style.css เองเลย (เพราะ specificity เท่ากัน ผู้มาทีหลังชนะ) — เกิดเฉพาะตอนเน็ตเวิร์กโหลด CDN
     สำเร็จเท่านั้น (อธิบายได้ว่าทำไมตอนแรกผมทดสอบในเครื่องแล้วไม่เจอปัญหา เพราะเครื่องทดสอบบล็อกการเรียก CDN ภายนอกไว้)
     ลบสคริปต์นี้ทิ้งเลยปลอดภัย 100% เพราะไม่มีอะไรในเว็บพึ่งพา class ของ Tailwind อยู่จริง -->
<!-- Font Awesome ฝังไฟล์ไว้ในเว็บเอง (ไม่พึ่ง CDN ภายนอก ตามแนวทางเดิมของโปรเจกต์ เหมือนฟอนต์ Sarabun) -->
<link rel="stylesheet" href="assets/fontawesome/css/fontawesome.min.css" />
<link rel="stylesheet" href="assets/fontawesome/css/solid.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css?v=1.98.2.021126" />
<!-- 1.56: ธีมสีจากค่าที่จำไว้ (ใส่หลัง style.css ให้ทับค่าเริ่มต้น) — ดู applyThemeColor ใน api.js -->
<script>(function(){try{var c=localStorage.getItem('bnkah_theme_css');if(c){var e=document.createElement('style');e.id='bnkahThemeVars';e.textContent=c;document.head.appendChild(e);}}catch(e){}})();</script>
</head>
<body>
  <div class="topbar">
    <button class="brand js-home-btn" type="button" tabindex="-1" style="cursor:default;"><span class="js-brand-logo"><span class="logo-dot"></span></span> <span class="js-site-name">BNKAcademicHub</span></button>
    <div class="user-info"><span>หน้าแสดงผลงาน (สาธารณะ)</span></div>
  </div>

  <div id="publicHeader" class="public-header" hidden>
    <div class="avatar" id="publicAvatar"></div>
    <h1 id="teacherName">-</h1>
    <div class="status-note" id="statusNote"></div>
  </div>

  <!-- ตัวกรองภาคเรียน/ปีการศึกษา + ช่องค้นหา + ปุ่มรีเฟรช (ตั้งแต่ V12.0) — ค่าเริ่มต้นของภาคเรียน/ปีคือค่าที่ Super Admin ตั้งไว้ (หรือคำนวณจากเวลาจริงถ้ายังไม่ตั้ง)
       ปุ่มรีเฟรชจะดึงข้อมูลผลงานใหม่ทั้งหมด + รีเซ็ตตัวกรองกลับไปที่ภาคเรียน/ปี "ปัจจุบันจริงตามเวลา" เสมอ (ไม่ใช้ค่าที่แอดมินตั้งเอง)
       1.71: กว้างขึ้น (1080px) — ประเภทงานเป็นกล่องเรียง 2 คอลัมน์บนจอใหญ่ / 1 คอลัมน์บนมือถือ · เกียรติบัตรเป็นกล่องหนึ่งในตาราง -->
  <div class="container-narrow view-wide">
    <div id="viewFilterBar" class="card view-filter" hidden>
      <select id="viewFilterYear"></select>
      <select id="viewFilterSemester">
        <option value="">ทุกภาคเรียน</option>
        <option value="1">ภาคเรียนที่ 1</option>
        <option value="2">ภาคเรียนที่ 2</option>
        <option value="summer">ภาคฤดูร้อน</option>
      </select>
      <input type="search" id="viewSearchInput" placeholder="ค้นหาชื่อผลงาน..." />
      <button type="button" class="btn btn-secondary btn-sm" id="viewRefreshBtn" title="รีเฟรชข้อมูล + กลับไปภาคเรียน/ปีปัจจุบันจริงตามเวลา"><i class="fas fa-rotate ui-icon" aria-hidden="true"></i> รีเฟรช</button>
    </div>
    <div id="content"><div class="loading">กำลังโหลดข้อมูล</div></div>
  </div>

  <div id="app-footer"></div>

  <script src="assets/api.js?v=1.98.2.021126"></script>
  <script>
    mountFooter();
    applyBranding();
    // 1.71: กดแบนเนอร์/ชื่อเว็บด้านบนไม่ไปหน้าไหน (เหมือนหน้าค้นหาเกียรติบัตร) — หน้านี้เปิดให้บุคคลภายนอกดู

    function getParam(name) { return new URLSearchParams(location.search).get(name); }

    // 1.97: Worker ส่งมาเฉพาะหัวข้อที่เปิด "แสดงในหน้าผลงานครู" — แสดงด้วยชื่อหัวข้อที่เก็บไว้กับงาน (api.js)
    function customFieldsText(values) { return fieldsLineText(values); }

    // ---------- 1.71: รูปแบบการแสดงผลงานเหลือ 3 แบบ (ตั้งที่ "ประเภทงาน" ในหน้าตั้งค่า — ค่าเดิมแปลงด้วย normalizeTemplate) ----------
    //  'bookInline' = ไฟล์ใหญ่: เล่มเอกสารสัดส่วน A4 เต็มกล่อง ทีละเล่ม + ตัวเลื่อน "เล่มที่ x จาก N" + ปุ่ม "เต็มจอ"
    //  'frame'      = ไฟล์ปานกลาง: กรอบทองแบบเกียรติบัตร (ไม่มีที่ห้อย) 2 ชิ้นต่อแถว ชื่อ/รายละเอียดใต้กรอบ
    //  ''           = ไฟล์เล็ก: รายการ (ไอคอนชนิดไฟล์ · ชื่อ · วันที่) + ปุ่มดู = ป็อปอัปพรีวิว เลื่อนก่อนหน้า/ถัดไปในประเภทเดียวกัน
    //                 แสดง 5 รายการแรก + "ดูทั้งหมด (N)"
    // ไม่มีปุ่มดาวน์โหลด/เปิดไฟล์ในหน้านี้ (ตามที่โรงเรียนกำหนด — ดาวน์โหลดได้เฉพาะครูในระบบ)
    var SMALL_SHOW = 5;
    var TH_M = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
    var allGroups = [];  // data.groups (ผลงานตามภาคเรียน/ปี)
    var allCerts = [];   // 1.59: เกียรติบัตรที่ครูคนนี้ได้รับ (คลังเกียรติบัตร)
    var certDisplayPos = -1; // 1.71: ตำแหน่งกล่องเกียรติบัตรเทียบกับลำดับประเภทงาน (-1 = ท้ายสุด)
    var _viewFiltersInitialized = false;
    var _boxes = {};     // key กล่อง -> ข้อมูลกล่อง (ใช้ตอนกดปุ่มในกล่อง)
    var _boxState = {};  // key กล่อง -> { page, all } คงไว้ระหว่างเปลี่ยนตัวกรอง

    // แปลงผลงาน/ไฟล์เกียรติบัตรเป็นรายการสำหรับพรีวิว
    function previewKind(name, mime) {
      var k = fileKindOf(name, mime);
      return k === 'image' || k === 'video' ? k : 'pdf'; // office/อื่นๆ ใช้ตัวพรีวิวของ Drive (ไม่มีปุ่มดาวน์โหลด)
    }
    function subEntry(it) {
      var id = it.fileId || driveFileId(it.fileUrl);
      return { title: it.title || '', id: id, previewUrl: id ? 'https://drive.google.com/file/d/' + id + '/preview' : drivePreviewUrl(it.fileUrl), kind: previewKind(it.fileName, it.mimeType), fileName: it.fileName || '', mime: it.mimeType || '' };
    }
    function certEntries(c) {
      return (c.files || []).map(function (f, i, arr) {
        var id = driveFileId(f.fileUrl) || driveFileId(f.previewUrl);
        return { title: c.activity + (arr.length > 1 ? ' — ไฟล์ที่ ' + (i + 1) : ''), id: id, previewUrl: f.previewUrl || drivePreviewUrl(f.fileUrl), kind: previewKind(f.name, f.mimeType), fileName: f.name || '' };
      });
    }
    function showPreview(entries, i) {
      var e = entries[i]; if (!e) return;
      openFilePreview(e.previewUrl, e.title, '', '', entries.length > 1 ? { index: i, total: entries.length, go: function (j) { showPreview(entries, j); } } : null, e.kind);
    }
    function thumbHtml(id, alt) {
      return id ? '<img class="vmf-img" src="https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w640" data-fallback="https://lh3.googleusercontent.com/d/' + encodeURIComponent(id) + '=w640" alt="' + escapeHtml(alt) + '" referrerpolicy="no-referrer" loading="lazy" />'
        : '<div class="no-img"><i class="fa-solid fa-award" aria-hidden="true"></i></div>';
    }
    function certDateText(c) {
      var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(c.certDate || '');
      return m ? Number(m[3]) + ' ' + TH_M[Number(m[2]) - 1] + ' ' + (Number(m[1]) + 543) : '';
    }

    // ---------- เนื้อหาในกล่องแต่ละแบบ ----------
    // 1.72: สัดส่วนกรอบไฟล์ใหญ่ตามหน้าแรกของไฟล์จริง — อ่านขนาดภาพย่อของ Drive (แนวนอน/แนวตั้ง) เก็บไว้ต่อไฟล์
    //       ระหว่างรอ/อ่านไม่ได้: เดาจากชนิดไฟล์ (PowerPoint = 16:9 แนวนอน · อื่นๆ = A4 แนวตั้ง)
    var _ratio = {}, _ratioProbe = {};
    function guessRatio(e) {
      if (_ratio[e.id]) return _ratio[e.id];
      var n = String(e.fileName || '').toLowerCase(), m = String(e.mime || '').toLowerCase();
      return (/\.(pptx?|ppsx?|potx?|odp|key)$/.test(n) || /presentation|powerpoint/.test(m)) ? 16 / 9 : 210 / 297;
    }
    function probeRatio(e) {
      if (!e.id || e.kind === 'image' || _ratio[e.id] || _ratioProbe[e.id]) return; // รูปภาพใช้ขนาดจริงจาก <img> (wireLargeImages)
      _ratioProbe[e.id] = 1;
      var im = new Image();
      im.referrerPolicy = 'no-referrer';
      im.onload = function () {
        if (!im.naturalWidth || !im.naturalHeight) return;
        var r = im.naturalWidth / im.naturalHeight;
        r = r > 1.2 ? (r > 1.6 ? 16 / 9 : 297 / 210) : r < 0.85 ? 210 / 297 : 1; // ปัดเป็นสัดส่วนมาตรฐาน กันกรอบกระโดดจากภาพย่อที่ขนาดเพี้ยนเล็กน้อย
        _ratio[e.id] = r;
        document.querySelectorAll('.vlg-a4[data-fid="' + e.id + '"]').forEach(function (el) { el.style.aspectRatio = String(r); el.classList.toggle('land', r > 1); });
      };
      im.src = 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(e.id) + '&sz=w320';
    }
    function largeBodyHtml(box) {
      var st = _boxState[box.key] || (_boxState[box.key] = { page: 0, all: false });
      if (st.page >= box.items.length) st.page = 0;
      var it = box.items[st.page], e = box.entries[st.page];
      var meta = [formatDateThai(it.uploadedAt), customFieldsText(it.customFieldValues)].filter(Boolean).join(' · ');
      var r = guessRatio(e);
      box.entries.forEach(probeRatio);
      // 1.73: รูปภาพแสดงเป็น <img> (ลิงก์รูปตรง -> ภาพย่อ -> ตัวพรีวิวของ Drive) — ตัวพรีวิวของ Drive มักขึ้น "เกิดปัญหาในการแสดงภาพนี้" กับรูป
      var inner = e.kind === 'image' && e.id
        ? '<img class="vlg-image" src="https://lh3.googleusercontent.com/d/' + encodeURIComponent(e.id) + '=w1600" data-fallback="https://drive.google.com/thumbnail?id=' + encodeURIComponent(e.id) + '&sz=w1600" data-preview="' + escapeHtml(e.previewUrl) + '" alt="' + escapeHtml(it.title) + '" referrerpolicy="no-referrer" />'
        : '<iframe src="' + escapeHtml(e.previewUrl) + '" loading="lazy" title="' + escapeHtml(it.title) + '"></iframe>';
      var html = (e.id ? '<div class="vlg-a4' + (r > 1 ? ' land' : '') + (e.kind === 'image' ? ' vlg-photo' : '') + '" data-fid="' + escapeHtml(e.id) + '" style="aspect-ratio:' + r + ';">' + inner + '</div>'
          : '<div class="vlg-a4 vlg-empty"><span><i class="fa-solid fa-book-open" aria-hidden="true"></i> ไม่มีไฟล์แนบ</span></div>') +
        '<div class="vlg-bar"><div class="vlg-txt"><div class="vlg-t">' + escapeHtml(it.title) + '</div>' +
          (it.description ? '<div class="vlg-d">' + escapeHtml(it.description) + '</div>' : '') +
          '<div class="vlg-m">' + escapeHtml(meta) + '</div></div>' +
          (e.id ? '<button type="button" class="btn btn-secondary btn-sm vlg-full" data-full="' + st.page + '"><i class="fa-solid fa-expand" aria-hidden="true"></i> เต็มจอ</button>' : '') + '</div>';
      // หลายไฟล์: รายการ 2 คอลัมน์ใต้ตัวแสดง กดเลือกไฟล์ไหนก็แสดงไฟล์นั้น
      if (box.items.length > 1) {
        html += '<div class="vlg-list">' + box.items.map(function (x, i) {
          var on = i === st.page;
          return '<button type="button" class="vlg-li' + (on ? ' on' : '') + '" data-pick="' + i + '"' + (on ? ' aria-current="true"' : '') + '>' +
            fileTypeIconHtml(x.fileName, x.mimeType, 'sm') +
            '<span class="vlg-li-txt"><b>' + escapeHtml(x.title) + '</b><small>' + (on ? '<span class="vlg-now">กำลังแสดง</span> · ' : '') + escapeHtml(formatDateThai(x.uploadedAt)) + '</small></span></button>';
        }).join('') + '</div>';
      }
      return html;
    }
    function mediumBodyHtml(box) {
      return '<div class="vmf-grid">' + box.items.map(function (it, i) {
        var e = box.entries[i];
        var title = box.isCerts ? it.activity + (it.competition ? ' · ' + it.competition : '') : it.title;
        var meta = box.isCerts ? [it.award, it.awardLevel, certDateText(it), it.certNo ? 'เลขที่ ' + it.certNo : ''].filter(Boolean).join(' · ')
          : [formatDateThai(it.uploadedAt), customFieldsText(it.customFieldValues)].filter(Boolean).join(' · ');
        return '<div class="vmf">' +
          '<button type="button" class="vmf-frame" data-open="' + i + '"' + (e ? '' : ' disabled') + ' aria-label="ดู ' + escapeHtml(title) + '">' +
            '<span class="tpl-frame"><span class="tpl-frame-corner tpl-frame-corner-tl"></span><span class="tpl-frame-corner tpl-frame-corner-tr"></span>' +
            '<span class="tpl-frame-corner tpl-frame-corner-bl"></span><span class="tpl-frame-corner tpl-frame-corner-br"></span>' +
            '<span class="tpl-frame-mat">' + thumbHtml(e && e.id, title) + '</span></span></button>' +
          '<div class="vmf-t">' + escapeHtml(title) + '</div>' + (meta ? '<div class="vmf-m">' + escapeHtml(meta) + '</div>' : '') +
        '</div>';
      }).join('') + '</div>';
    }
    function smallBodyHtml(box) {
      var st = _boxState[box.key] || (_boxState[box.key] = { page: 0, all: false });
      var n = box.items.length, show = st.all ? n : Math.min(n, SMALL_SHOW);
      var html = '<div class="vsl">';
      for (var i = 0; i < show; i++) {
        var it = box.items[i], e = box.entries[i];
        html += '<div class="vsl-r">' + fileTypeIconHtml(it.fileName, it.mimeType) +
          '<div class="vsl-txt"><div class="vsl-t">' + escapeHtml(it.title) + '</div><div class="vsl-m">' + escapeHtml([formatDateThai(it.uploadedAt), customFieldsText(it.customFieldValues)].filter(Boolean).join(' · ')) + '</div></div>' +
          (e && (e.id || it.fileUrl) ? '<button type="button" class="vsl-eye" data-open="' + i + '" title="ดูไฟล์" aria-label="ดู ' + escapeHtml(it.title) + '"><i class="fa-solid fa-eye"></i></button>' : '') + '</div>';
      }
      html += '</div>';
      if (n > SMALL_SHOW) html += '<button type="button" class="vsl-more" data-all="1">' + (st.all ? 'ย่อรายการ <i class="fa-solid fa-chevron-up"></i>' : 'ดูทั้งหมด (' + n + ') <i class="fa-solid fa-chevron-down"></i>') + '</button>';
      return html;
    }
    function boxBodyHtml(box) {
      return box.tier === 'bookInline' ? largeBodyHtml(box) : box.tier === 'frame' ? mediumBodyHtml(box) : smallBodyHtml(box);
    }
    function boxHtml(box) {
      var tierCls = box.tier === 'bookInline' ? 'vbox-large' : box.tier === 'frame' ? 'vbox-medium' : 'vbox-small';
      // 1.72: พื้นกล่องสีจางตามสีกลุ่มบริหารงาน (--g) · กล่องเกียรติบัตรใช้โทนทอง
      return '<section class="vbox ' + tierCls + (box.isCerts ? ' vbox-certs' : '') + '" data-box="' + escapeHtml(box.key) + '" style="--g:' + escapeHtml(box.isCerts ? '#d97706' : box.color) + ';">' +
        '<div class="vbox-h">' + (box.isCerts ? '<i class="fa-solid fa-award vbox-ic" aria-hidden="true"></i>' : '<span class="vbox-dot" style="background:' + escapeHtml(box.color) + ';"></span>') +
          '<span class="vbox-name">' + escapeHtml(box.name) + '</span><span class="vbox-n">' + box.items.length + '</span></div>' +
        '<div class="vbox-body">' + boxBodyHtml(box) + '</div></section>';
    }

    // ---------- ตัวกรองภาคเรียน/ปีการศึกษา + ค้นหา + รีเฟรช (ตั้งแต่ V12.0) ----------
    function fillViewFilters() {
      var yearSel = document.getElementById('viewFilterYear');
      var curYear = yearSel.value;
      var years = Array.from(new Set(allGroups.map(function (g) { return g.academicYear; }).concat(allCerts.map(function (c) { return c.academicYear; })))).filter(Boolean);
      years.sort().reverse();
      yearSel.innerHTML = '<option value="">ทุกปีการศึกษา</option>' + years.map(function (y) {
        return '<option value="' + escapeHtml(y) + '">ปีการศึกษา ' + escapeHtml(y) + '</option>';
      }).join('');
      if (years.indexOf(curYear) !== -1) yearSel.value = curYear;
    }
    // trueNow = true: ใช้เวลาจริงตอนนี้เสมอ (ปุ่มรีเฟรช) / false: ใช้ค่าเริ่มต้นที่ Super Admin ตั้งไว้ (หรือเวลาจริงถ้ายังไม่ตั้ง)
    async function applyTermFilter(trueNow) {
      var term = trueNow ? trueCurrentAcademicTerm(await getSiteSettings()) : await currentAcademicTerm();
      var yearSel = document.getElementById('viewFilterYear');
      var hasOption = Array.from(yearSel.options).some(function (o) { return o.value === term.year; });
      if (!hasOption) {
        var opt = document.createElement('option');
        opt.value = term.year; opt.textContent = 'ปีการศึกษา ' + term.year;
        yearSel.appendChild(opt);
      }
      yearSel.value = term.year;
      document.getElementById('viewFilterSemester').value = term.semester;
    }

    // จัดกล่องลง 2 คอลัมน์ (จอกว้าง) โดยวางกล่องถัดไปในคอลัมน์ที่เตี้ยกว่า — ลำดับอ่านจากบนลงล่างยังตามลำดับที่ตั้งไว้
    // จอแคบ: คอลัมน์เดียวตามลำดับ
    var _wideMq = window.matchMedia('(min-width: 820px)');
    function layoutGrid(grid, boxesHtml) {
      if (!_wideMq.matches || boxesHtml.length < 2) { grid.className = 'vgrid one'; grid.innerHTML = boxesHtml.join(''); return; }
      grid.className = 'vgrid two';
      grid.innerHTML = '<div class="vcol"></div><div class="vcol"></div>';
      var cols = grid.children;
      boxesHtml.forEach(function (h) {
        var c = cols[0].offsetHeight <= cols[1].offsetHeight ? cols[0] : cols[1];
        c.insertAdjacentHTML('beforeend', h);
      });
    }
    function semCmp(a, b) { return String(b).localeCompare(String(a)); }

    function renderFilteredContent() {
      var content = document.getElementById('content');
      var yearFilter = document.getElementById('viewFilterYear').value;
      var semFilter = document.getElementById('viewFilterSemester').value;
      var q = document.getElementById('viewSearchInput').value.trim().toLowerCase();
      if (allGroups.length === 0 && allCerts.length === 0) {
        content.innerHTML = '<div class="card"><div class="empty-state">ยังไม่มีผลงานที่เผยแพร่</div></div>';
        return;
      }
      var terms = {}; // "ปี|ภาคเรียน" -> { year, sem, items, certs }
      function termOf(y, s) { var k = y + '|' + s; return terms[k] || (terms[k] = { year: y, sem: s, items: [], certs: [] }); }
      allGroups.forEach(function (g) {
        if (yearFilter && g.academicYear !== yearFilter) return;
        if (semFilter && g.semester !== semFilter) return;
        g.items.forEach(function (it) {
          if (q && (it.title || '').toLowerCase().indexOf(q) === -1) return;
          termOf(g.academicYear, g.semester).items.push(it);
        });
      });
      allCerts.forEach(function (c) {
        if (yearFilter && c.academicYear !== yearFilter) return;
        if (semFilter && c.semester !== semFilter) return;
        if (q && (c.activity + ' ' + (c.competition || '') + ' ' + (c.award || '')).toLowerCase().indexOf(q) === -1) return;
        termOf(c.academicYear, c.semester).certs.push(c);
      });
      var list = Object.keys(terms).map(function (k) { return terms[k]; }).filter(function (t) { return t.items.length || t.certs.length; });
      if (!list.length) {
        content.innerHTML = '<div class="card"><div class="empty-state">' + (q ? 'ไม่พบผลงานที่ตรงกับคำค้นหา' : 'ยังไม่มีผลงานที่เผยแพร่ในภาคเรียนที่เลือก') + '</div></div>';
        return;
      }
      list.sort(function (a, b) { return a.year !== b.year ? semCmp(a.year, b.year) : semCmp(a.sem, b.sem); });
      _boxes = {};
      content.innerHTML = list.map(function (t, ti) {
        var semLabel = t.sem === 'summer' ? 'ภาคฤดูร้อน' : 'ภาคเรียนที่ ' + t.sem;
        return '<div class="card view-term"><div class="year-group-title view-term-title">ปีการศึกษา ' + escapeHtml(t.year) + ' — ' + semLabel + '</div><div class="vgrid" data-term="' + ti + '"></div></div>';
      }).join('');
      list.forEach(function (t, ti) {
        // กล่องประเภทงาน — ลำดับตาม g.items ที่ Worker จัดมาแล้ว (display_order ของประเภทงาน)
        var boxes = [], map = {};
        t.items.forEach(function (it) {
          var name = it.categoryName || 'ไม่ระบุประเภทงาน';
          if (!map[name]) {
            map[name] = { key: t.year + '|' + t.sem + '|c|' + name, name: name, order: it.displayOrder || 0, tier: normalizeTemplate(it.displayTemplate),
              color: categoryColor({ department: it.categoryDepartment, color: it.categoryColor }), items: [] };
            boxes.push(map[name]);
          }
          map[name].items.push(it);
        });
        boxes.forEach(function (b) { b.entries = b.items.map(subEntry); });
        if (t.certs.length) {
          var cb = { key: t.year + '|' + t.sem + '|certs', name: 'เกียรติบัตร', isCerts: true, tier: 'frame', items: t.certs };
          cb.entries = t.certs.map(function (c) { return certEntries(c)[0] || null; });
          var at = boxes.length;
          if (certDisplayPos >= 0) { for (var i = 0; i < boxes.length; i++) { if (boxes[i].order >= certDisplayPos) { at = i; break; } } }
          boxes.splice(at, 0, cb);
        }
        boxes.forEach(function (b) { _boxes[b.key] = b; });
        layoutGrid(content.querySelector('.vgrid[data-term="' + ti + '"]'), boxes.map(function (b, i) { return boxHtml(b).replace('<section ', '<section data-seq="' + i + '" '); }));
      });
      wireThumbs(content);
    }
    // 1.73: รูปในกล่องไฟล์ใหญ่ — ได้สัดส่วนจริงของรูป (จำกัด 0.6–1.9) · โหลดไม่ได้ทั้งลิงก์ตรงและภาพย่อ = ใช้ตัวพรีวิวของ Drive
    function wireLargeImages(root) {
      root.querySelectorAll('img.vlg-image:not([data-wired])').forEach(function (img) {
        img.setAttribute('data-wired', '1');
        function fit() {
          if (!img.naturalWidth || !img.naturalHeight) return;
          var r = Math.max(0.6, Math.min(1.9, img.naturalWidth / img.naturalHeight)), box = img.parentNode, fid = box.getAttribute('data-fid');
          if (fid) _ratio[fid] = r;
          box.style.aspectRatio = String(r); box.classList.toggle('land', r > 1);
        }
        img.addEventListener('load', fit);
        img.addEventListener('error', function () {
          var alt = img.getAttribute('data-fallback');
          if (alt) { img.removeAttribute('data-fallback'); img.src = alt; return; }
          var ifr = document.createElement('iframe');
          ifr.src = img.getAttribute('data-preview'); ifr.title = img.alt;
          img.parentNode.classList.remove('vlg-photo');
          img.replaceWith(ifr);
        });
        if (img.complete && img.naturalWidth) fit();
      });
    }
    function wireThumbs(root) {
      wireLargeImages(root);
      root.querySelectorAll('img.vmf-img:not([data-wired])').forEach(function (img) {
        img.setAttribute('data-wired', '1');
        img.addEventListener('error', function () {
          var alt = img.getAttribute('data-fallback');
          if (alt) { img.removeAttribute('data-fallback'); img.src = alt; return; }
          img.outerHTML = '<div class="no-img"><i class="fa-solid fa-award" aria-hidden="true"></i></div>';
        });
      });
    }
    function rerenderBox(sec) {
      var box = _boxes[sec.getAttribute('data-box')]; if (!box) return;
      sec.querySelector('.vbox-body').innerHTML = boxBodyHtml(box);
      wireThumbs(sec);
    }
    document.getElementById('content').addEventListener('click', function (e) {
      var sec = e.target.closest('.vbox'); if (!sec) return;
      var box = _boxes[sec.getAttribute('data-box')]; if (!box) return;
      var st = _boxState[box.key] || (_boxState[box.key] = { page: 0, all: false });
      var b;
      if ((b = e.target.closest('[data-pick]'))) { var pi = Number(b.getAttribute('data-pick')); if (pi !== st.page) { st.page = pi; rerenderBox(sec); } return; }
      if ((b = e.target.closest('[data-all]'))) { st.all = !st.all; rerenderBox(sec); return; }
      if ((b = e.target.closest('[data-full]'))) { openViewEntries(box, Number(b.getAttribute('data-full'))); return; }
      if ((b = e.target.closest('[data-open]'))) { openViewEntries(box, Number(b.getAttribute('data-open'))); return; }
    });
    // เปิดพรีวิว — เลื่อนก่อนหน้า/ถัดไปได้ภายในกล่องเดียวกัน (เกียรติบัตรหลายไฟล์ = ไล่ทุกไฟล์)
    function openViewEntries(box, idx) {
      var flat = [], start = 0;
      box.items.forEach(function (it, i) {
        var es = box.isCerts ? certEntries(it) : [box.entries[i]];
        if (i === idx) start = flat.length;
        es.forEach(function (x) { if (x && (x.id || x.previewUrl)) flat.push(x); });
      });
      if (flat.length) showPreview(flat, Math.min(start, flat.length - 1));
    }
    var _lastWide = _wideMq.matches;
    window.addEventListener('resize', function () {
      if (_wideMq.matches !== _lastWide) { _lastWide = _wideMq.matches; renderFilteredContent(); }
    });

    ['viewFilterYear', 'viewFilterSemester'].forEach(function (id) {
      document.getElementById(id).addEventListener('change', renderFilteredContent);
    });
    document.getElementById('viewSearchInput').addEventListener('input', renderFilteredContent);

    async function load() {
      var username = getParam('u') || getParam('username') || getParam('slug');
      var userIdParam = getParam('id'); // ตั้งแต่ 1.33.101026: เปิดจากหน้า "ทำเนียบบุคลากร" ด้วยรหัสบัญชี (ไม่เปิดเผยชื่อผู้ใช้)
      var content = document.getElementById('content');
      if (!username && !userIdParam) {
        content.innerHTML = '<div class="error-box">ไม่พบพารามิเตอร์ผู้ใช้ (u) ในลิงก์</div>';
        return;
      }
      try {
        var data = await apiCall('publicGetSummary', username ? { username: username } : { userId: userIdParam });
        await getSiteSettings().catch(function () {}); // สีกลุ่มบริหารงาน (departmentColors) สำหรับจุดสีหัวกล่อง
        document.getElementById('publicHeader').hidden = false;
        document.getElementById('teacherName').textContent = data.name;
        document.getElementById('publicAvatar').innerHTML = avatarInnerHtml(data.avatarUrl);
        var note = document.getElementById('statusNote');
        note.textContent = data.status === 'archived' ? 'บัญชีนี้ถูกระงับ' : '';

        allGroups = data.groups || [];
        allCerts = data.certificates || [];
        certDisplayPos = typeof data.certDisplayPos === 'number' ? data.certDisplayPos : -1;
        document.getElementById('viewFilterBar').hidden = allGroups.length === 0 && allCerts.length === 0;
        fillViewFilters();
        // ตั้งค่าเริ่มต้นตัวกรองแค่ตอนโหลดหน้าครั้งแรกเท่านั้น (ปุ่มรีเฟรชจัดการ reset เอง)
        if (!_viewFiltersInitialized) {
          await applyTermFilter(false);
          _viewFiltersInitialized = true;
        }
        renderFilteredContent();
      } catch (err) {
        content.innerHTML = '<div class="error-box">' + escapeHtml(err.message) + '</div>';
      }
    }
    document.getElementById('viewRefreshBtn').addEventListener('click', async function () {
      document.getElementById('viewSearchInput').value = '';
      await load(); // ดึงผลงานล่าสุดใหม่ทั้งหมด
      await applyTermFilter(true); // แล้วรีเซ็ตตัวกรองกลับไปภาคเรียน/ปี "ปัจจุบันจริงตามเวลา" เสมอ
      renderFilteredContent();
    });
    load();
  </script>
</body>
</html>
