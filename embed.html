<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>อัลบั้มรูปภาพ</title>
<!-- 1.84.2: หน้าฝังอัลบั้ม (iframe) — embed.html#a=<id> (แบบตารางรูป) · #a=<id>&s=card (แบบการ์ดรูปปก) · เฉพาะอัลบั้มที่แสดงในหน้าสาธารณะ -->
<link rel="stylesheet" href="assets/fontawesome/css/fontawesome.min.css" />
<link rel="stylesheet" href="assets/fontawesome/css/solid.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --pri: #0b6fcc; --txt: #0f172a; --mut: #64748b; --bd: #e2e8f0; --bg: #ffffff; --ph: #e8eef7; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --txt: #e2e8f0; --mut: #94a3b8; --bd: #334155; --bg: #0f172a; --ph: #1e293b; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body { font-family: 'Noto Sans Thai', 'Sarabun', system-ui, sans-serif; color: var(--txt); padding: 2px; }
  .e { background: var(--bg); border: 1px solid var(--bd); border-radius: 16px; overflow: hidden; }
  .e-h { padding: 12px 14px 10px; min-width: 0; }
  .e-h b { display: block; font-size: 1.02rem; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .e-h small { color: var(--mut); font-size: .82rem; }
  .e-g { display: grid; gap: 4px; height: 250px; padding: 0 14px; }
  .e-g a { position: relative; display: block; overflow: hidden; border-radius: 8px; background: var(--ph); }
  .e-g img, .e-c-cv img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s; }
  .e-g a:hover img, .e-c-cv:hover img { transform: scale(1.04); }
  .e-g .more::after { content: attr(data-more); position: absolute; inset: 0; background: rgba(15, 23, 42, .55); color: #fff; font-weight: 700; font-size: 1.35rem; display: flex; align-items: center; justify-content: center; }
  .ph-ic { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--pri); font-size: 30px; opacity: .55; }
  .g1 { grid-template-columns: 1fr; }
  .g2 { grid-template-columns: 1fr 1fr; }
  .g3 { grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; } .g3 a:first-child { grid-row: span 2; }
  .g5 { grid-template-columns: 2fr 1fr 1fr; grid-template-rows: 1fr 1fr; } .g5 a:first-child { grid-row: span 2; }
  .e-f { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px 12px; }
  .e-f small { color: var(--mut); font-size: .76rem; display: flex; gap: 6px; align-items: center; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .e-f .btn { flex: none; background: var(--pri); color: #fff; border-radius: 10px; padding: 7px 14px; font-weight: 700; font-size: .86rem; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
  .e-f .btn:hover { filter: brightness(1.08); }
  .e-c-cv { position: relative; display: block; aspect-ratio: 16 / 9; background: var(--ph); overflow: hidden; }
  .e-c-n { position: absolute; right: 8px; bottom: 8px; background: rgba(0, 0, 0, .55); color: #fff; border-radius: 99px; padding: 1px 9px; font-size: .75rem; font-weight: 700; }
  .e-c .e-h { padding-bottom: 0; }
  .msg { padding: 28px 16px; text-align: center; color: var(--mut); font-size: .9rem; }
  @media (max-width: 460px) {
    .g5 { grid-template-columns: 1fr 1fr; grid-template-rows: 150px 1fr; } .g5 a:first-child { grid-column: span 2; grid-row: auto; } .g5 a:nth-child(n+4) { display: none; }
    .g3 { grid-template-columns: 1fr 1fr; grid-template-rows: 150px 1fr; } .g3 a:first-child { grid-column: span 2; grid-row: auto; }
  }
</style>
</head>
<body>
<div class="e" id="emb"><div class="msg">กำลังโหลด…</div></div>
<script src="assets/api.js?v=1.98.2.021126"></script>
<script>
(function () {
  var q = {}; location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) q[p[0]] = decodeURIComponent(p[1] || ''); });
  var box = document.getElementById('emb'), card = q.s === 'card';
  var thumb = function (id, w) { return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + (w || 800); };
  var ic = '<span class="ph-ic"><i class="fa-solid fa-images" aria-hidden="true"></i></span>';
  function fail(t) { box.innerHTML = '<div class="msg"><i class="fa-solid fa-circle-info" aria-hidden="true"></i> ' + escapeHtml(t) + '</div>'; }
  if (!q.a) { fail('ไม่ได้ระบุอัลบั้ม'); return; }
  apiCall('publicAlbumEmbed', { id: q.a }).then(function (d) {
    var a = d.album, url = a.url, n = a.photoCount || 0;
    document.title = a.title;
    var tgt = ' href="' + escapeHtml(url) + '" target="_blank" rel="noopener"';
    var foot = '<div class="e-f"><small><i class="fa-solid fa-images" aria-hidden="true"></i> คลังรูปภาพ' + (d.schoolName ? ' · ' + escapeHtml(d.schoolName) : '') + '</small><a class="btn"' + tgt + '><i class="fa-solid fa-folder-open" aria-hidden="true"></i> ดูรูปทั้งหมด</a></div>';
    var meta = '<small><i class="fa-solid fa-calendar-days" aria-hidden="true"></i> ' + escapeHtml(d.dateLabel || '') + (n ? ' · ' + n + ' รูป' : '') + '</small>';
    var ph = d.photos || [];
    var img = function (id, i, w) { return id ? '<img src="' + (i === 0 && !id ? '' : thumb(id, w)) + '" alt="" loading="lazy" referrerpolicy="no-referrer" data-i="' + i + '" />' : ''; };
    if (card || ph.length === 0) {
      var cv = ph[0] ? img(ph[0], 0, 1000) : (a.coverUrl && !/drive\.google\.com/.test(a.coverUrl) ? '<img src="' + escapeHtml(a.coverUrl) + '" alt="" referrerpolicy="no-referrer" data-i="0" />' : ic);
      box.className = 'e e-c';
      box.innerHTML = '<a class="e-c-cv"' + tgt + ' aria-label="ดูรูปทั้งหมด">' + cv + (n ? '<span class="e-c-n"><i class="fa-solid fa-images" aria-hidden="true"></i> ' + n + ' รูป</span>' : '') + '</a>' +
        '<div class="e-h"><b title="' + escapeHtml(a.title) + '">' + escapeHtml(a.title) + '</b>' + meta + '</div>' + foot;
    } else {
      var show = ph.slice(0, 5), k = show.length >= 5 ? 5 : show.length >= 3 ? 3 : show.length;
      show = show.slice(0, k);
      var rest = Math.max(0, n - k);
      box.className = 'e';
      box.innerHTML = '<div class="e-h"><b title="' + escapeHtml(a.title) + '">' + escapeHtml(a.title) + '</b>' + meta + '</div>' +
        '<div class="e-g g' + k + '">' + show.map(function (id, i) {
          var last = i === k - 1 && rest > 0;
          return '<a' + tgt + (last ? ' class="more" data-more="+' + rest + '"' : '') + ' aria-label="ดูรูปทั้งหมด">' + img(id, i, i === 0 ? 1000 : 500) + '</a>';
        }).join('') + '</div>' + foot;
    }
    // รูปย่อจาก Google Drive โหลดไม่ได้ → รูปแรกใช้รูปปกที่เก็บในระบบ · รูปอื่นเป็นไอคอน
    Array.prototype.forEach.call(box.querySelectorAll('img'), function (el) {
      el.addEventListener('error', function () {
        if (el.getAttribute('data-i') === '0' && d.coverData && el.src.indexOf('data:') !== 0) { el.src = d.coverData; return; }
        var p = el.parentNode; el.remove(); if (p && !p.querySelector('.ph-ic')) p.insertAdjacentHTML('afterbegin', ic);
      });
    });
  }).catch(function (e) { fail(e && e.message ? e.message : 'โหลดอัลบั้มไม่สำเร็จ'); });
})();
</script>
</body>
</html>
