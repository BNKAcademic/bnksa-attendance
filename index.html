<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- 1.80: PWA — ติดตั้งลงหน้าจอหลัก/คอมได้ (manifest + ไอคอน · sw.js ลงทะเบียนใน api.js) -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0b6fcc" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="BNK Hub" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<!-- หน้าล็อกอินบังคับใช้ธีมสว่างเท่านั้นเสมอ (ไม่ว่าจะเคยตั้งค่าธีมมืดไว้จากหน้าอื่นหรือไม่) จึงไม่มี script คืนค่าธีมมืดจาก localStorage แบบหน้าอื่นๆ ในตัว -->
<title>เข้าสู่ระบบ — BNKAcademicHub</title>
<!-- Tailwind CDN ที่เคยฝังไว้ตรงนี้ถูกเอาออกแล้ว (ตั้งแต่ V11.8.3) — สาเหตุที่แท้จริงของปัญหาช่องกรอกข้อมูล "ชิดขอบซ้าย"
     ที่ผู้ใช้แจ้งซ้ำหลายรอบ ยืนยันด้วยเครื่องคอมที่เพิ่งซื้อใหม่ไม่เคยตั้งค่าอะไรก็ยังเป็น + คอนโซล DevTools แสดง
     getComputedStyle(...).paddingLeft = "0px" จริง ทั้งที่ style.css ที่เซิร์ฟเวอร์ส่งออกมาตรงกับซอร์สทุกตัวอักษร:
     สคริปต์ Tailwind CDN ตัวนี้เดิมใส่ไว้แค่ช่วงออกแบบเพื่ออ้างอิงโทนสีเท่านั้น (ไม่มี class ของ Tailwind ใช้งานจริงในเว็บเลย
     สักจุด — เช็คแล้วทั้ง 5 หน้า) แต่ตัว CDN สร้าง Preflight (CSS reset มาตรฐานของ Tailwind ที่ตั้ง padding/border ของ
     input ทุกตัวเป็น 0 เพื่อ "ล้างค่า default ของเบราว์เซอร์") แล้วแทรกสไตล์ของตัวเองเข้า <head> ทีหลัง (browser ประมวลผล
     script แบบ async หลังโหลดเน็ตเวิร์กเสร็จ) ทำให้ชนะลำดับ cascade ทับ padding: 10px 28px ที่ style.css ของเราตั้งไว้
     โดยไม่มีทางแก้จากฝั่ง style.css เองเลย (เพราะ specificity เท่ากัน ผู้มาทีหลังชนะ) — เกิดเฉพาะตอนเน็ตเวิร์กโหลด CDN
     สำเร็จเท่านั้น (อธิบายได้ว่าทำไมตอนแรกผมทดสอบในเครื่องแล้วไม่เจอปัญหา เพราะเครื่องทดสอบบล็อกการเรียก CDN ภายนอกไว้)
     ลบสคริปต์นี้ทิ้งเลยปลอดภัย 100% เพราะไม่มีอะไรในเว็บพึ่งพา class ของ Tailwind อยู่จริง -->
<!-- Font Awesome ฝังไฟล์ไว้ในเว็บเอง (ไม่พึ่ง CDN ภายนอก ตามแนวทางเดิมของโปรเจกต์ เหมือนฟอนต์ Sarabun) -->
<link rel="stylesheet" href="assets/fontawesome/css/fontawesome.min.css" />
<link rel="stylesheet" href="assets/fontawesome/css/solid.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css?v=1.98.2.021126" />
<!-- 1.56: ธีมสีจากค่าที่จำไว้ (ใส่หลัง style.css ให้ทับค่าเริ่มต้น) — ดู applyThemeColor ใน api.js -->
<script>(function(){try{var c=localStorage.getItem('bnkah_theme_css_login');if(c){var e=document.createElement('style');e.id='bnkahThemeVars';e.textContent=c;document.head.appendChild(e);}}catch(e){}})();</script>
</head>
<body class="login-page">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-hero">
        <div class="login-title"><span class="js-brand-logo js-brand-logo-lg"><span class="logo-dot"></span></span></div>
        <div class="login-title"><span class="js-site-name">BNKAcademicHub</span></div>
        <div class="login-sub">ระบบรวบรวมและส่งผลงานครู</div>
      </div>
      <script>
        // 1.92.4.271026: มีรูปหน้าเข้าสู่ระบบที่จำไว้ -> ใส่ทันที (ก่อนโหลดค่าตั้งค่า) ไม่เห็นหัวสีม่วงแวบ — ค่าจริงอัปเดตอีกครั้งใน applyBranding()
        (function () { try { var b = JSON.parse(localStorage.getItem('bnkah_brand') || 'null'); if (b && b.loginHeroDataUrl) { var h = document.querySelector('.login-hero'), im = document.createElement('img'); im.className = 'login-hero-img'; im.alt = b.siteName || ''; im.src = b.loginHeroDataUrl; h.appendChild(im); h.classList.add('has-image'); } } catch (e) {} })();
      </script>

      <div id="errorBox" class="error-box" hidden></div>

      <form id="loginForm">
        <div class="field">
          <label for="username">ชื่อผู้ใช้ (Username)</label>
          <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required />
        </div>
        <div class="field">
          <label for="password">รหัสผ่าน</label>
          <div class="password-field-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" required />
            <!-- ปุ่มแสดง/ซ่อนรหัสผ่าน (ตั้งแต่ V11.8) — tabindex="-1" กันไม่ให้แทรกลำดับ Tab ระหว่างช่องรหัสผ่านกับปุ่มเข้าสู่ระบบ -->
            <button type="button" class="password-toggle-btn" id="togglePasswordBtn" tabindex="-1" aria-label="แสดง/ซ่อนรหัสผ่าน">
              <i class="fas fa-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        <!-- หมายเหตุ: ตั้งใจไม่ใส่คลาส "field" ที่ div นี้ (ต่างจาก .field ปกติ) เพราะ .login-card .field มี margin-bottom
             ตายตัวไว้ค่อนข้างมาก พอรวมกับช่องนี้ที่เพิ่มเข้ามาใหม่ (V11.8) จะทำให้การ์ดสูงเกินจอมือถือจอเตี้ยอีกครั้ง
             (ปัญหาเดียวกับที่เคยแก้ไว้ตั้งแต่ V11.6) จึงคุมระยะห่างเองแยกต่างหากให้กระชับกว่าแทน -->
        <!-- 1.80: 2 ช่องติ๊ก (2 แถว) — "จำชื่อผู้ใช้" เก็บเฉพาะชื่อผู้ใช้ (เลิกเก็บรหัสผ่าน) · "เข้าสู่ระบบอัตโนมัติ" ไม่ต้องเข้าใหม่
             จนกว่าจะไม่ได้ใช้งานเกิน 7 วัน (Super Admin ติ๊กได้แต่ไม่มีผล) — ไอคอน i แตะ/ชี้แล้วขึ้นคำอธิบาย -->
        <div class="remember-row">
          <label class="remember-check"><input type="checkbox" id="rememberMe" /> จำชื่อผู้ใช้</label>
          <div class="remember-line">
            <label class="remember-check"><input type="checkbox" id="keepLogin" /> เข้าสู่ระบบอัตโนมัติ</label>
            <button type="button" class="keep-info-btn" id="keepInfoBtn" aria-label="คำอธิบายเข้าสู่ระบบอัตโนมัติ" aria-expanded="false"><i class="fa-solid fa-circle-info" aria-hidden="true"></i></button>
            <div class="keep-tip" id="keepTip" role="tooltip" hidden>ไม่ต้องเข้าสู่ระบบใหม่ ถ้าไม่ได้ใช้งานเกิน 7 วันจะออกจากระบบเอง · ใช้เฉพาะเครื่องส่วนตัว</div>
          </div>
        </div>
        <button class="btn btn-primary btn-full" type="submit" id="loginBtn">เข้าสู่ระบบ</button>
      </form>
      <p class="hint login-contact">ติดต่อกลุ่มบริหารงานวิชาการเพื่อขอสร้างบัญชี</p>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="assets/api.js?v=1.98.2.021126"></script>
  <script>
    mountFooter({ compact: true }); // 1.80: หน้าล็อกอินใช้ footer แบบย่อ
    applyBranding();

    // ถ้าล็อกอินอยู่แล้ว พาไปหน้าที่เหมาะสมทันที
    (function () {
      var s = getSession();
      if (s && getToken()) location.href = homePageFor(s);
    })();

    var form = document.getElementById('loginForm');
    var errorBox = document.getElementById('errorBox');
    var loginBtn = document.getElementById('loginBtn');
    var usernameInput = document.getElementById('username');
    var passwordInput = document.getElementById('password');
    var rememberCheckbox = document.getElementById('rememberMe');

    // ---------- ปุ่มแสดง/ซ่อนรหัสผ่าน (ตั้งแต่ V11.8) ----------
    var togglePasswordBtn = document.getElementById('togglePasswordBtn');
    var togglePasswordIcon = togglePasswordBtn.querySelector('i');
    togglePasswordBtn.addEventListener('click', function () {
      var showing = passwordInput.type === 'text';
      passwordInput.type = showing ? 'password' : 'text';
      togglePasswordIcon.classList.toggle('fa-eye', showing);
      togglePasswordIcon.classList.toggle('fa-eye-slash', !showing);
    });

    // ---------- 1.80: จำชื่อผู้ใช้ (เฉพาะชื่อผู้ใช้) + เข้าสู่ระบบอัตโนมัติ ----------
    // เดิม (V11.8) "จดจำฉันไว้ในเบราว์เซอร์นี้" เก็บรหัสผ่านไว้ในเครื่องด้วย — เลิกเก็บแล้ว และลบรหัสผ่านที่เคยเก็บไว้ทิ้งทันที
    // ที่เปิดหน้านี้ (เก็บชื่อผู้ใช้ไว้ให้เหมือนเดิม) · การไม่ต้องล็อกอินบ่อยใช้ "เข้าสู่ระบบอัตโนมัติ" แทน (token ฝั่ง Worker)
    var REMEMBER_LOGIN_KEY = 'bnkah_remember_login';
    var KEEP_PREF_KEY = 'bnkah_keep_pref';
    var keepCheckbox = document.getElementById('keepLogin');
    (function restoreRememberedLogin() {
      try {
        var raw = localStorage.getItem(REMEMBER_LOGIN_KEY);
        if (raw) {
          var saved = JSON.parse(raw);
          if (saved && saved.username) {
            usernameInput.value = saved.username;
            rememberCheckbox.checked = true;
            if ('password' in saved) localStorage.setItem(REMEMBER_LOGIN_KEY, JSON.stringify({ username: saved.username }));
          } else localStorage.removeItem(REMEMBER_LOGIN_KEY);
        }
        keepCheckbox.checked = localStorage.getItem(KEEP_PREF_KEY) === '1';
      } catch (e) { /* localStorage อาจถูกปิด หรือค่าที่เก็บไว้เสียหาย — ข้ามไปเฉยๆ */ }
      if (usernameInput.value) passwordInput.focus();
    })();
    var keepInfoBtn = document.getElementById('keepInfoBtn'), keepTip = document.getElementById('keepTip');
    function setKeepTip(open) { keepTip.hidden = !open; keepInfoBtn.setAttribute('aria-expanded', String(open)); }
    keepInfoBtn.addEventListener('click', function (e) { e.stopPropagation(); setKeepTip(keepTip.hidden); });
    keepInfoBtn.addEventListener('mouseenter', function () { if (matchMedia('(hover: hover)').matches) setKeepTip(true); });
    keepInfoBtn.addEventListener('mouseleave', function () { if (matchMedia('(hover: hover)').matches) setKeepTip(false); });
    document.addEventListener('click', function (e) { if (!keepTip.hidden && !e.target.closest('.remember-line')) setKeepTip(false); });

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      errorBox.hidden = true;
      loginBtn.disabled = true;
      loginBtn.textContent = 'กำลังเข้าสู่ระบบ...';
      try {
        var username = usernameInput.value.trim();
        var password = passwordInput.value;
        var data = await apiCall('login', { username: username, password: password, keep: keepCheckbox.checked });
        try {
          if (rememberCheckbox.checked) localStorage.setItem(REMEMBER_LOGIN_KEY, JSON.stringify({ username: username }));
          else localStorage.removeItem(REMEMBER_LOGIN_KEY);
          localStorage.setItem(KEEP_PREF_KEY, keepCheckbox.checked ? '1' : '0');
        } catch (e) { /* localStorage อาจถูกปิด — ไม่กระทบการล็อกอิน แค่จำค่าไว้ให้ไม่ได้ */ }
        setSession(data.token, data.user);
        applyAccountTheme(data.user); // 1.41.111026: ใช้ Dark Mode ที่บัญชีนี้เคยเลือกไว้
        location.href = homePageFor(data.user);
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
        loginBtn.disabled = false;
        loginBtn.textContent = 'เข้าสู่ระบบ';
      }
    });
  </script>
</body>
</html>
