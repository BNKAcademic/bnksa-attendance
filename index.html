<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบเช็คชื่อนักเรียนอัจฉริยะ</title>
    <link rel="icon" id="faviconLink" href="">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col selection:bg-indigo-100 selection:text-indigo-900">

    <nav class="glass-effect border-b border-slate-200/80 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 sm:h-20 items-center">
                <div class="flex items-center cursor-pointer group min-w-0" onclick="window.navigate('dashboard')">
                    <div id="navLogoBox" class="w-10 h-10 sm:w-12 sm:h-12 bg-gradient-to-br from-indigo-500 to-blue-600 rounded-xl sm:rounded-2xl flex items-center justify-center text-white font-bold text-xl sm:text-2xl shadow-lg shadow-indigo-200 group-hover:scale-105 transition-transform shrink-0 overflow-hidden"><i class="fas fa-graduation-cap" id="navLogoIcon"></i><img id="navLogoImg" class="hidden w-full h-full object-cover" alt="โลโก้"></div>
                    <div class="ml-3 sm:ml-4 min-w-0">
                        <h1 class="text-lg sm:text-2xl font-extrabold text-slate-800 tracking-tight leading-tight truncate" id="navTitle">ระบบเช็คชื่อ</h1>
                        <div class="flex items-center gap-1.5 flex-wrap"><p class="text-[10px] sm:text-sm text-slate-500 font-medium" id="navSubtitle">กำลังเชื่อมต่อ...</p><span id="serverStatusBadge" class="hidden items-center gap-1 text-[9px] sm:text-[10px] font-bold px-1.5 py-0.5 rounded-full border"><span id="serverStatusDot" class="w-1.5 h-1.5 rounded-full"></span><span id="serverStatusText"></span></span></div>
                    </div>
                </div>
                <div class="flex items-center gap-1.5 sm:gap-3">
                    <button id="btnRefreshData" onclick="window.refreshData()" title="รีเฟรชข้อมูล" class="bg-white border border-slate-200 hover:border-indigo-300 hover:bg-indigo-50 text-slate-600 hover:text-indigo-700 w-9 h-9 sm:w-11 sm:h-11 rounded-xl text-sm sm:text-base font-bold transition-all shadow-sm flex items-center justify-center shrink-0"><i class="fas fa-sync-alt" id="refreshIcon"></i></button>
                    <button id="btnDarkMode" onclick="window.toggleDarkMode()" title="สลับโหมดมืด/สว่าง" class="bg-white border border-slate-200 hover:border-indigo-300 hover:bg-indigo-50 text-slate-600 hover:text-indigo-700 w-9 h-9 sm:w-11 sm:h-11 rounded-xl text-sm sm:text-base font-bold transition-all shadow-sm flex items-center justify-center shrink-0"><i class="fas fa-moon" id="darkModeIcon"></i></button>
                    <button id="btnAdminLogin" onclick="window.navigate('admin_login')" class="bg-white border border-slate-200 hover:border-indigo-300 hover:bg-indigo-50 text-slate-600 hover:text-indigo-700 px-3 sm:px-5 py-2 sm:py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all shadow-sm flex items-center gap-2"><i class="fas fa-user-shield"></i> <span class="hidden sm:inline">ผู้ดูแลระบบ</span></button>
                    <button id="currentUserBadge" onclick="window.showUserBadgeInfo()" type="button" class="hidden bg-slate-50 border border-slate-200 text-slate-700 w-9 h-9 sm:w-auto sm:h-auto sm:px-3 py-2 sm:py-2.5 rounded-full sm:rounded-xl text-[10px] sm:text-xs font-bold items-center justify-center sm:gap-1.5 hover:bg-slate-100 transition-colors"><i class="fas fa-user-circle text-indigo-500 text-sm sm:text-base"></i> <span id="currentUserBadgeName" class="hidden sm:inline"></span> <span id="currentUserBadgeRole" class="hidden sm:inline-block px-1.5 py-0.5 rounded-full text-[9px] sm:text-[10px] font-black"></span></button>
                    <button id="btnAdminPanel" onclick="window.navigate('admin')" class="hidden bg-indigo-50 text-indigo-700 hover:bg-indigo-600 hover:text-white border border-indigo-200 px-3 sm:px-5 py-2 sm:py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all shadow-sm flex items-center gap-2"><i class="fas fa-cog"></i> <span class="hidden sm:inline">จัดการระบบ</span></button>
                    <button id="btnAdminLogout" onclick="window.logoutAdmin()" class="hidden bg-rose-50 text-rose-600 hover:bg-rose-600 hover:text-white border border-rose-200 px-3 sm:px-5 py-2 sm:py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all shadow-sm flex items-center gap-2"><i class="fas fa-sign-out-alt"></i> <span class="hidden sm:inline">ออก</span></button>
                </div>
            </div>
        </div>
    </nav>


    <div class="sticky top-16 sm:top-20 z-30">
        <div id="holidayBar" class="hidden bg-gradient-to-r from-rose-50 to-red-50 border-b-2 border-rose-300 shadow-sm">
            <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-2 sm:py-3 flex items-start sm:items-center gap-2 sm:gap-3">
                <div class="w-6 h-6 sm:w-8 sm:h-8 bg-rose-500 text-white rounded-full flex items-center justify-center text-[10px] sm:text-sm shrink-0 shadow-sm"><i class="fas fa-calendar-times"></i></div>
                <span id="holidayBarText" class="flex-1 min-w-0 text-rose-800 text-[11px] sm:text-sm font-bold leading-snug break-words"></span>
            </div>
        </div>
        <div id="announcementBar" class="hidden bg-gradient-to-r from-amber-50 to-orange-50 border-b-2 border-amber-300 shadow-sm">
            <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-2 sm:py-3 flex items-start sm:items-center gap-2 sm:gap-3">
                <div class="w-6 h-6 sm:w-8 sm:h-8 bg-amber-400 text-white rounded-full flex items-center justify-center text-[10px] sm:text-sm shrink-0 shadow-sm"><i class="fas fa-bullhorn"></i></div>
                <span id="announcementText" class="flex-1 min-w-0 text-amber-900 text-[11px] sm:text-sm font-bold leading-snug break-words"></span>
            </div>
        </div>
    </div>

    <main id="mainContent" class="flex-grow max-w-7xl mx-auto px-2 sm:px-6 lg:px-8 py-6 sm:py-10 w-full"></main>

    <footer class="w-full text-center py-6 sm:py-8 border-t border-slate-200/70 bg-white/60">
        <p class="text-xs sm:text-sm font-extrabold text-slate-600">Developed and Created by Jeerasak Chomphuwattana</p>
        <p class="text-[10px] sm:text-xs font-bold text-slate-400 mt-1">Powered by AI</p>
    </footer>

    <div id="toastContainer" class="fixed top-20 sm:top-24 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-3 w-full max-w-md px-4 pointer-events-none"></div>

    <div id="confirmModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm max-h-[90vh] overflow-y-auto transform scale-95 opacity-0 transition-all duration-300" id="confirmModalBox">
            <div class="p-6 sm:p-8 text-center">
                <div class="w-16 h-16 sm:w-20 sm:h-20 bg-rose-100 rounded-full flex items-center justify-center mx-auto mb-4 sm:mb-6 text-rose-500 text-3xl sm:text-4xl shadow-inner"><i class="fas fa-exclamation-triangle"></i></div>
                <h3 class="text-xl sm:text-2xl font-extrabold text-slate-800 mb-2" id="confirmTitle">ยืนยันการดำเนินการ</h3>
                <p class="text-sm sm:text-base text-slate-500 mb-6 sm:mb-8 font-medium" id="confirmMessage">คุณแน่ใจหรือไม่?</p>
                <div class="flex gap-3"><button onclick="window.closeConfirm()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl sm:rounded-2xl font-bold transition-colors text-sm sm:text-base">ยกเลิก</button><button id="confirmBtn" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white py-3 rounded-xl sm:rounded-2xl font-bold transition-colors shadow-lg shadow-rose-200 text-sm sm:text-base">ยืนยัน</button></div>
            </div>
        </div>
    </div>

    <div id="promptModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm max-h-[90vh] overflow-y-auto transform scale-95 opacity-0 transition-all duration-300" id="promptModalBox">
            <div class="p-6 sm:p-8 text-center">
                <div class="w-16 h-16 sm:w-20 sm:h-20 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4 sm:mb-6 text-indigo-500 text-3xl sm:text-4xl shadow-inner"><i class="fas fa-edit"></i></div>
                <h3 class="text-xl sm:text-2xl font-extrabold text-slate-800 mb-2" id="promptTitle">แก้ไขข้อมูล</h3>
                <p class="text-sm sm:text-base text-slate-500 mb-4 sm:mb-6 font-medium" id="promptMessage">กรุณากรอกข้อมูลใหม่</p>
                <input type="text" id="promptInput" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-5 py-3 mb-6 sm:mb-8 focus:outline-none focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 font-bold text-center text-slate-700 text-base sm:text-lg">
                <div class="flex gap-3"><button onclick="window.closePrompt()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl sm:rounded-2xl font-bold transition-colors text-sm sm:text-base">ยกเลิก</button><button id="promptBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl sm:rounded-2xl font-bold transition-colors shadow-lg shadow-indigo-200 text-sm sm:text-base">บันทึก</button></div>
            </div>
        </div>
    </div>

    <div id="registerChoiceModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm transform scale-95 opacity-0 transition-all duration-300" id="registerChoiceModalBox">
            <div class="p-6 sm:p-8 text-center">
                <div class="w-16 h-16 sm:w-20 sm:h-20 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4 sm:mb-6 text-indigo-500 text-3xl sm:text-4xl shadow-inner"><i class="fas fa-book"></i></div>
                <h3 class="text-xl sm:text-2xl font-extrabold text-slate-800 mb-2">สร้างสมุดทะเบียน</h3>
                <p class="text-sm sm:text-base text-slate-500 mb-6 font-medium">เลือกรูปแบบที่ต้องการจัดทำ</p>
                <div class="space-y-3 mb-4">
                    <button onclick="window.__chooseRegisterMode('summary')" class="w-full text-left bg-slate-50 hover:bg-indigo-50 border-2 border-slate-200 hover:border-indigo-300 rounded-2xl p-4 transition-all">
                        <div class="font-bold text-slate-800 flex items-center gap-2"><i class="fas fa-file-alt text-indigo-500"></i> จัดทำเฉพาะสรุป</div>
                        <div class="text-xs text-slate-500 mt-1">ปก + สรุปทั้งเดือน + ลงนาม, และรายชื่อเข้าเรียนไม่ครบ + ลงนาม (ไม่รวมบันทึกรายวัน) — ไฟล์สั้น กระชับ</div>
                    </button>
                    <button onclick="window.__chooseRegisterMode('incomplete_only')" class="w-full text-left bg-slate-50 hover:bg-orange-50 border-2 border-slate-200 hover:border-orange-300 rounded-2xl p-4 transition-all">
                        <div class="font-bold text-slate-800 flex items-center gap-2"><i class="fas fa-door-open text-orange-500"></i> จัดทำเฉพาะรายชื่อเข้าเรียนไม่ครบ</div>
                        <div class="text-xs text-slate-500 mt-1">เฉพาะรายชื่อ "มาแต่เข้าเรียนไม่ครบ" + ลงนาม (ไม่มีปก ไม่มีสรุปทั้งเดือน) — ไฟล์สั้นที่สุด</div>
                    </button>
                    <button onclick="window.__chooseRegisterMode('full')" class="w-full text-left bg-slate-50 hover:bg-indigo-50 border-2 border-slate-200 hover:border-indigo-300 rounded-2xl p-4 transition-all">
                        <div class="font-bold text-slate-800 flex items-center gap-2"><i class="fas fa-book-open text-indigo-500"></i> จัดทำทั้งเล่ม</div>
                        <div class="text-xs text-slate-500 mt-1">รวมภาคผนวกบันทึกรายวันทุกวันด้วย — ไฟล์ใหญ่กว่า หลายสิบหน้า</div>
                    </button>
                </div>
                <button onclick="window.closeRegisterChoiceModal()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl sm:rounded-2xl font-bold transition-colors text-sm sm:text-base">ยกเลิก</button>
            </div>
        </div>
    </div>

    <div id="progressModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm transform scale-95 opacity-0 transition-all duration-300" id="progressModalBox">
            <div class="p-6 sm:p-8 text-center">
                <div class="w-16 h-16 sm:w-20 sm:h-20 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4 sm:mb-6 text-indigo-500 text-3xl sm:text-4xl shadow-inner" id="progressIconWrap"><i class="fas fa-cog fa-spin" id="progressIcon"></i></div>
                <h3 class="text-xl sm:text-2xl font-extrabold text-slate-800 mb-2" id="progressTitle">กำลังดำเนินการ</h3>
                <p class="text-sm sm:text-base text-slate-500 mb-4 font-medium" id="progressMessage">กรุณารอสักครู่...</p>
                <div class="w-full h-3 sm:h-4 bg-slate-200 rounded-full overflow-hidden shadow-inner mb-2"><div id="progressBarFill" class="bg-indigo-600 h-full rounded-full transition-all duration-300" style="width: 0%"></div></div>
                <p class="text-xs sm:text-sm font-bold text-slate-400 mb-6" id="progressPercentText">0%</p>
                <button id="progressCloseBtn" onclick="window.closeProgressModal()" class="hidden w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl sm:rounded-2xl font-bold transition-colors shadow-lg shadow-indigo-200 text-sm sm:text-base">ปิด</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
